name: Temporary portal lint fixer

on:
  push:
    branches:
      - feat/seven-portal-completion-chatgpt

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply exact lint fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'apps/api/src/backend/portalExperienceRoutes.ts': [
              ("    const conversation = await residentConversationAccess(deps, agency, principal, site, conversationId);", "    await residentConversationAccess(deps, agency, principal, site, conversationId);")
            ],
            'apps/api/src/backend/portalScopedRoutes.ts': [
              ("  const agencyId = agencyHeader(req); const site = requireSite(req); const principal = await sitePrincipal(req, deps, correlationId, agencyId, site);", "  const agencyId = agencyHeader(req); const site = requireSite(req); await sitePrincipal(req, deps, correlationId, agencyId, site);")
            ],
            'apps/web/types/index.ts': [
              ("import type { AgencyOrganisationSettings, DashboardOverview, SecurityRole, UserRole } from '@pcr/domain';", "import type { AgencyOrganisationSettings, DashboardOverview, SecurityRole } from '@pcr/domain';")
            ],
          }
          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected source text not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY
          node scripts/format.mjs --write
      - name: Commit lint fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/backend/portalExperienceRoutes.ts apps/api/src/backend/portalScopedRoutes.ts apps/web/types/index.ts
          git commit -m "fix(portals): clear final lint findings"
          git push origin HEAD:feat/seven-portal-completion-chatgpt
