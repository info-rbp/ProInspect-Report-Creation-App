name: Launch v2.7 safeguard finalizer

on:
  push:
    branches:
      - feat/launch-readiness-v27-operator-safeguards

permissions:
  contents: write

concurrency:
  group: launch-v27-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Materialize v2.7 safeguards
        run: node scripts/launch-v27-materialize.mjs

      - name: Finalize operator safeguards
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync,writeFileSync } from 'node:fs';

          const operatorPath='infrastructure/upgrades/launch-readiness-v2/operator.mjs';
          let operator=readFileSync(operatorPath,'utf8');
          const signature='export async function safeRepair(config, environment, directory) {';
          if(operator.includes(signature)) operator=operator.replace(signature,'export async function safeRepair(config, environment) {');
          if(!operator.includes('function recheckCommand(environment, stage)')) {
            const anchor="function commandSuffix(environment) {\n  return environment === 'development' ? '' : ` --env ${environment}`;\n}\n";
            if(!operator.includes(anchor)) throw new Error('commandSuffix anchor not found');
            operator=operator.replace(anchor,`${anchor}function recheckCommand(environment, stage) {\n  const suffix = commandSuffix(environment);\n  if (stage === 'preflight') return \`npm run launch:preflight --\${suffix} --all\`;\n  if (stage === 'reconcile') return \`npm run launch:reconcile --\${suffix} --stage all\`;\n  return \`npm run launch:check --\${suffix} --stage \${stage}\`;\n}\n`);
          }
          operator=operator.replace("if (code === 'AUTHORITY') return `Run npm run launch:authority, repair the reported Appwrite-authority source paths, then repeat: npm run launch:check --${suffix} --stage ${stage}`;","if (code === 'AUTHORITY') return `Run npm run launch:authority, repair the reported Appwrite-authority source paths, then repeat: ${recheckCommand(environment, stage)}`;");
          operator=operator.replace("return `Re-run npm run launch:check --${suffix} --stage ${stage} after correcting the reported condition.`;","return `Correct the reported condition, then re-run: ${recheckCommand(environment, stage)}`;");
          operator=operator.replace("recheck: recheck || `npm run launch:check --${suffix} --stage ${stage}`,","recheck: recheck || recheckCommand(environment, stage),");
          operator=operator.replace("  const suffix = commandSuffix(environment);\n  return {\n    id: issueId(environment, stage, code),","  return {\n    id: issueId(environment, stage, code),");
          operator=operator.replace("  const ledger = syncIssueLedger(directory, environment, context, issues, ['*']);","  const ledger = syncIssueLedger(directory, environment, context, issues, ['preflight']);");
          operator=operator.replace("  syncIssueLedger(directory, environment, context, issues, scanned);","  syncIssueLedger(directory, environment, context, issues, ['reconcile', ...scanned]);");
          operator=operator.replace("  const blocked = states.some((item) => ['INVALIDATED', 'RECHECK_REQUIRED'].includes(item.status));","  const blocked = issues.some((item) => item.severity === 'BLOCKER') || states.some((item) => ['INVALIDATED', 'RECHECK_REQUIRED'].includes(item.status));");
          writeFileSync(operatorPath,operator);

          const cliPath='infrastructure/upgrades/launch-readiness-v2/cli.mjs';
          let cli=readFileSync(cliPath,'utf8');
          cli=cli.replace("    if(!existsSync(directory))return;\n",'');
          writeFileSync(cliPath,cli);

          const testPath='infrastructure/upgrades/launch-readiness-v2/tests/operator.test.mjs';
          let tests=readFileSync(testPath,'utf8');
          if(!tests.includes('diagnostic issues use executable diagnostic recheck commands')) {
            tests += `\n\ntest('diagnostic issues use executable diagnostic recheck commands',()=>{\n  const preflight=makeIssue({environment:'development',stage:'preflight',code:'CONFIGURATION',message:'missing'});\n  const reconciliation=makeIssue({environment:'staging',stage:'reconcile',code:'WORKTREE_DIRTY',message:'dirty'});\n  assert.equal(preflight.recheck,'npm run launch:preflight -- --all');\n  assert.equal(reconciliation.recheck,'npm run launch:reconcile -- --env staging --stage all');\n});\n\ntest('reconciliation treats ledger blockers as blocking',()=>{\n  const source=readFileSync(resolve(packageRoot,'operator.mjs'),'utf8');\n  assert.match(source,/issues\.some\(\(item\) => item\.severity === 'BLOCKER'\)/u);\n});\n\ntest('preflight and reconciliation preserve issue-ledger scope',()=>{\n  const source=readFileSync(resolve(packageRoot,'operator.mjs'),'utf8');\n  assert.match(source,/syncIssueLedger\(directory, environment, context, issues, \['preflight'\]\)/u);\n  assert.match(source,/\['reconcile', \.\.\.scanned\]/u);\n});\n`;
          }
          writeFileSync(testPath,tests);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Appwrite resources before candidate
        run: npm run appwrite:generate

      - name: Format candidate
        run: npm run format

      - name: Regenerate exact launch package integrity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const base=resolve('infrastructure/upgrades/launch-readiness-v2');
          function walk(prefix=''){
            return readdirSync(resolve(base,prefix),{withFileTypes:true}).flatMap((entry)=>{
              const rel=prefix ? `${prefix}/${entry.name}` : entry.name;
              const full=resolve(base,rel);
              if(entry.isDirectory()) return walk(rel);
              if(!statSync(full).isFile()) throw new Error(`Unsupported package entry ${rel}`);
              return rel==='integrity.json' ? [] : [rel];
            }).sort();
          }
          const files={};
          for(const rel of walk()) files[rel]=createHash('sha256').update(readFileSync(resolve(base,rel))).digest('hex');
          writeFileSync(resolve(base,'integrity.json'),`${JSON.stringify({algorithm:'sha256',files},null,2)}\n`);
          NODE

      - name: Create exact candidate commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(launch): guided installation safeguards v2.7"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Syntax check launch modules
        shell: bash
        run: |
          find infrastructure/upgrades/launch-readiness-v2 infrastructure/launch-scenarios -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Repository formatting check
        run: npm run format:check

      - name: Repository lint
        run: npm run lint

      - name: Repository typecheck
        run: npm run typecheck

      - name: Normalize tracked TypeScript cache after typecheck
        shell: bash
        run: |
          git ls-files -z '*tsconfig.tsbuildinfo' | xargs -0 -r git restore --worktree --
          status="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo 'Unexpected source changes after typecheck.' >&2
            exit 1
          fi

      - name: Repository unit and rules tests
        run: npm run test:run

      - name: Appwrite schema generation and validation
        shell: bash
        run: |
          npm run appwrite:validate
          status="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo 'Appwrite validation changed the exact candidate.' >&2
            exit 1
          fi

      - name: Build all packages and applications
        run: npm run build

      - name: Normalize tracked TypeScript cache after build
        shell: bash
        run: |
          git ls-files -z '*tsconfig.tsbuildinfo' | xargs -0 -r git restore --worktree --
          status="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo 'Unexpected source changes after build.' >&2
            exit 1
          fi

      - name: Verify built artifacts
        run: npm run verify:dist

      - name: Launch regression tests
        run: npm run launch:test

      - name: Exact package integrity audit
        shell: bash
        run: |
          npm run launch:audit
          test -f "$(git rev-parse --git-path proinspect-launch-v2)/development/operator-report.md"

      - name: Non-production plan remains non-mutating
        run: npm run launch:plan

      - name: Guided diagnostics collect blockers instead of crashing
        shell: bash
        run: |
          npm run launch:init
          set +e
          npm run launch:preflight -- --all > /tmp/preflight.log 2>&1
          code=$?
          set -e
          cat /tmp/preflight.log
          test "$code" -eq 2
          grep -q 'PREFLIGHT_BLOCKED' /tmp/preflight.log
          npm run launch:issues > /tmp/issues.log
          cat /tmp/issues.log
          grep -q 'OPEN_BLOCKERS' /tmp/issues.log
          npm run launch:reconcile -- --stage all > /tmp/reconcile.log 2>&1
          cat /tmp/reconcile.log
          grep -q 'SAFE_TO_CONTINUE' /tmp/reconcile.log
          test -f "$(git rev-parse --git-path proinspect-launch-v2)/development/operator-report.md"
          test -f "$(git rev-parse --git-path proinspect-launch-v2)/development/issues.json"

      - name: Authority safeguard blocks legacy worker runtime
        shell: bash
        run: |
          set +e
          npm run launch:authority > /tmp/authority.log 2>&1
          code=$?
          set -e
          cat /tmp/authority.log
          test "$code" -ne 0
          grep -q '"pass": false' /tmp/authority.log

      - name: Candidate stayed clean
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          status="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            git diff --stat
            exit 1
          fi

      - name: Publish verified candidate
        run: git push origin HEAD:feat/launch-readiness-v27-operator-safeguards
