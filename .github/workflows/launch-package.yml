name: Launch package validation
on:
  push:
    branches: [feat/launch-readiness-installation-v2]
  pull_request:
    paths:
      - infrastructure/upgrades/launch-readiness-v2/**
      - .github/workflows/launch-package.yml
      - package.json
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source without credentials or local state
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/proinspect-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: proinspect-source-${{ github.sha }}
          path: ${{ runner.temp }}/proinspect-source.zip
          retention-days: 1
          if-no-files-found: error
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Installer regression tests
        run: node --test infrastructure/upgrades/launch-readiness-v2/tests/installer.test.mjs
      - name: Exact package integrity
        run: node infrastructure/upgrades/launch-readiness-v2/cli.mjs audit
      - name: Clean-checkout dry run
        run: node infrastructure/upgrades/launch-readiness-v2/cli.mjs plan
