name: CI
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Scan tracked source for committed secrets
        run: npm run security:scan
      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Build shared packages
        run: npm run build:packages
      - name: Type check web
        id: web_typecheck
        run: |
          set -o pipefail
          npm run typecheck --workspace @pcr/web 2>&1 | tee web-typecheck.log
      - name: Upload web typecheck diagnostics
        if: failure() && steps.web_typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: web-typecheck-diagnostics
          path: web-typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Type check API
        id: api_typecheck
        run: |
          set -o pipefail
          npm run typecheck --workspace @pcr/api 2>&1 | tee api-typecheck.log
      - name: Upload API typecheck diagnostics
        if: failure() && steps.api_typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: api-typecheck-diagnostics
          path: api-typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Type check AI worker
        run: npm run typecheck --workspace @pcr/ai-worker
      - name: Type check PDF worker
        run: npm run typecheck --workspace @pcr/pdf-worker
      - name: Type check notification worker
        run: npm run typecheck --workspace @pcr/notification-worker
      - name: Type check dashboard worker
        run: npm run typecheck --workspace @pcr/dashboard-worker
      - name: Type check document worker
        run: npm run typecheck --workspace @pcr/document-worker
      - name: Type check integration worker
        run: npm run typecheck --workspace @pcr/integration-worker
      - name: Type check shared packages
        run: npm run typecheck --workspace @pcr/domain && npm run typecheck --workspace @pcr/config && npm run typecheck --workspace @pcr/validation && npm run typecheck --workspace @pcr/templates && npm run typecheck --workspace @pcr/report-presentation && npm run typecheck --workspace @pcr/testing && npm run typecheck --workspace @pcr/ui
      - name: Formatting
        run: npm run format:check
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 1
      - name: Unit and rules tests
        run: npm run test:run
      - name: Build applications
        id: build_apps
        run: |
          set -o pipefail
          npm run build:apps 2>&1 | tee build-apps.log
      - name: Upload application build diagnostics
        if: failure() && steps.build_apps.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: build-apps-diagnostics
          path: build-apps.log
          if-no-files-found: error
          retention-days: 1
      - name: Verify built artifacts
        id: verify_dist
        run: |
          set -o pipefail
          npm run verify:dist 2>&1 | tee verify-dist.log
      - name: Upload built artifact diagnostics
        if: failure() && steps.verify_dist.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: verify-dist-diagnostics
          path: verify-dist.log
          if-no-files-found: error
          retention-days: 1
      - name: Firebase emulator tests
        run: npm run test:emulator
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  report:
    if: always()
    needs: [validate, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Publish combined validation status
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VALIDATE_RESULT" = "success" ] && [ "$BROWSER_RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION="Full validation and browser E2E passed"
          else
            STATE=failure
            DESCRIPTION="Validation=$VALIDATE_RESULT, browser=$BROWSER_RESULT"
          fi
          jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context "ci/full-validation" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' \
            > status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @status.json \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA"
