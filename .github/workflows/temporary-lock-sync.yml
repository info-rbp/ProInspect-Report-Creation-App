name: Temporary lockfile sync

on:
  push:
    branches:
      - feat/genspark-preinstall-readiness

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/genspark-preinstall-readiness
      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "proinspect-lock-bot"
          git config user.email "info@remotebusinesspartner.com.au"
          git add package-lock.json
          git diff --cached --check
          git commit -m "chore(workers): synchronize Appwrite workspace lockfile"
          git push origin HEAD:feat/genspark-preinstall-readiness
