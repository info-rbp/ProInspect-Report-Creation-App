name: Platform Completion Update

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/platform-completion-v1
    paths:
      - 'infrastructure/upgrades/platform-completion-v1/**'
      - '.github/workflows/platform-completion-update.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: platform-completion-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - name: Pin npm and Appwrite CLI
        run: |
          npm install -g npm@10.9.2 appwrite-cli@27.2.1
          node --version
          npm --version
          appwrite --version
      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply and verify Stage 2D-13 software update
        run: node infrastructure/upgrades/platform-completion-v1/upgrade.mjs ci
      - name: Confirm update diff is bounded
        shell: bash
        run: |
          git diff --check
          if git status --porcelain | grep -E '(^|/)tsconfig\.tsbuildinfo$'; then
            echo '::error::Generated tsconfig.tsbuildinfo files remain modified after update verification.'
            exit 1
          fi
          git status --short
