name: Temporary launch audit

on:
  push:
    branches:
      - feat/genspark-preinstall-readiness

permissions:
  contents: read

jobs:
  launch-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/genspark-preinstall-readiness
      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Runtime authority
        run: npm run launch:authority
      - name: Launch tests
        run: npm run launch:test
      - name: Launch integrity audit
        run: npm run launch:audit
