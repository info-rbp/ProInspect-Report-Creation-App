name: Final deployment review v2.6
on:
  push:
    branches: [feat/launch-readiness-installation-v2]
permissions:
  contents: write
concurrency:
  group: final-deployment-review-v26
  cancel-in-progress: true
jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply final review fixes
        run: |
          node .github/final-review-v26.mjs
          node .github/final-review-toolchain-v26.mjs
          node .github/final-review-terraform-retirement-v26.mjs
      - name: Normalize formatting
        run: |
          npm run format
          terraform fmt -recursive infrastructure/terraform
      - name: Regenerate exact launch package integrity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync,readdirSync,writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const base='infrastructure/upgrades/launch-readiness-v2';
          function files(prefix=''){return readdirSync(resolve(base,prefix),{withFileTypes:true}).flatMap((entry)=>{const name=prefix?`${prefix}/${entry.name}`:entry.name;return entry.isDirectory()?files(name):[name];}).sort();}
          const index={algorithm:'sha256',files:{}};
          for(const name of files().filter((name)=>name!=='integrity.json'))index.files[name]=createHash('sha256').update(readFileSync(resolve(base,name))).digest('hex');
          writeFileSync(resolve(base,'integrity.json'),JSON.stringify(index,null,2)+'\n');
          NODE
      - name: Create isolated candidate commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/final-review-v26.mjs .github/final-review-toolchain-v26.mjs .github/final-review-terraform-retirement-v26.mjs .github/workflows/final-review-v26.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(launch): final deployment hardening v2.6'
      - name: Syntax check launch modules
        run: find infrastructure/upgrades/launch-readiness-v2 infrastructure/launch-scenarios -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Validate Terraform module and environments
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infrastructure/terraform
          terraform -chdir=infrastructure/terraform/modules/environment init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/modules/environment validate
          rm -rf infrastructure/terraform/modules/environment/.terraform infrastructure/terraform/modules/environment/.terraform.lock.hcl
          for env in development staging production; do
            src="infrastructure/terraform/environments/$env"
            tmp="infrastructure/terraform/environments/.validate-$env"
            rm -rf "$tmp"
            cp -R "$src" "$tmp"
            rm -rf "$tmp/.terraform"
            python3 - "$tmp/main.tf" <<'PY'
          import re, sys
          path=sys.argv[1]
          text=open(path,encoding='utf-8').read()
          text,count=re.subn(r'\n\s*backend\s+"gcs"\s*\{\s*\}\s*', '\n', text, count=1)
          if count != 1:
              raise SystemExit('expected exactly one empty gcs backend stanza')
          open(path,'w',encoding='utf-8').write(text)
          PY
            terraform -chdir="$tmp" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$tmp" validate
            rm -rf "$tmp"
          done
      - name: Repository validation
        run: npm run check
      - name: Launch regression tests
        run: npm run launch:test
      - name: Exact package integrity
        run: npm run launch:audit
      - name: Development and Staging plan remains non-production
        run: npm run launch:plan
      - name: Production remains separately gated
        run: npm run launch:release -- plan
      - name: Verify authority scanner catches current worker migration debt
        shell: bash
        run: |
          set -euo pipefail
          if npm run launch:authority > "$RUNNER_TEMP/authority.json" 2>&1; then
            echo 'Expected current standalone worker sources to remain blocked until Appwrite worker migration is completed.' >&2
            exit 1
          fi
          grep -q 'BLOCKED\|"pass": false' "$RUNNER_TEMP/authority.json" || { cat "$RUNNER_TEMP/authority.json"; exit 1; }
      - name: Push verified v2.6 candidate
        run: git push origin HEAD:feat/launch-readiness-installation-v2
