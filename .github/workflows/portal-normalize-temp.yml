name: Temporary portal branch normalizer

on:
  push:
    branches:
      - feat/seven-portal-completion-chatgpt

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Normalize repository files
        run: node scripts/format.mjs --write
      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize seven-portal implementation"
          git push origin HEAD:feat/seven-portal-completion-chatgpt
