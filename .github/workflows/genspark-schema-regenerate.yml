name: Temporary Appwrite schema regeneration
on:
  push:
    branches: [feat/genspark-preinstall-readiness]
permissions:
  contents: write
concurrency:
  group: genspark-schema-regenerate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, 'chore(appwrite): regenerate table definitions') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/genspark-preinstall-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Generate canonical Appwrite table definitions
        run: node infrastructure/appwrite/scripts/generate-resources.mjs
      - name: Commit generated artifact only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- infrastructure/appwrite/tables/tables.json; then
            echo 'tables.json already synchronized'
            exit 0
          fi
          git config user.name 'proinspect-schema-bot'
          git config user.email 'info@remotebusinesspartner.com.au'
          git add infrastructure/appwrite/tables/tables.json
          git diff --cached --check
          git commit -m 'chore(appwrite): regenerate table definitions'
          git push origin HEAD:feat/genspark-preinstall-readiness
