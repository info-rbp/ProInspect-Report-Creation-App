name: Finalize launch readiness v2.5
on:
  push:
    branches: [feat/launch-readiness-installation-v2]
permissions:
  contents: write
concurrency:
  group: finalize-launch-readiness-v25
  cancel-in-progress: true
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Finalize and harden v2.5 package metadata
        shell: bash
        run: |
          set -euo pipefail
          node .github/finalize-launch-v25.mjs
          node .github/harden-launch-release-v25.mjs
          node .github/fix-launch-scenario-contract-v25.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize repository formatting
        run: npm run format
      - name: Regenerate exact package integrity after formatting
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const base='infrastructure/upgrades/launch-readiness-v2';
          function files(prefix=''){return readdirSync(resolve(base,prefix),{withFileTypes:true}).flatMap((entry)=>{const name=prefix?`${prefix}/${entry.name}`:entry.name;return entry.isDirectory()?files(name):[name];}).sort();}
          const index={algorithm:'sha256',files:{}};
          for(const name of files().filter((name)=>name!=='integrity.json'))index.files[name]=createHash('sha256').update(readFileSync(resolve(base,name))).digest('hex');
          writeFileSync(resolve(base,'integrity.json'),JSON.stringify(index,null,2)+'\n');
          NODE
      - name: Create candidate commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/finalize-launch-v25.mjs .github/harden-launch-release-v25.mjs .github/fix-launch-scenario-contract-v25.mjs .github/workflows/finalize-launch-readiness-v25.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(launch): complete deployment package v2.5'
      - name: Syntax-check launch modules
        run: find infrastructure/upgrades/launch-readiness-v2 infrastructure/launch-scenarios -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Repository validation
        run: npm run check
      - name: Launch package regression tests
        run: npm run launch:test
      - name: Exact launch package integrity
        run: npm run launch:audit
      - name: Development/Staging plan remains non-production
        run: npm run launch:plan
      - name: Production release remains separately planned
        run: npm run launch:release -- plan
      - name: Push verified v2.5 candidate
        run: git push origin HEAD:feat/launch-readiness-installation-v2
