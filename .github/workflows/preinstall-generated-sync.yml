name: Preinstall generated sync

on:
  push:
    branches:
      - feat/genspark-preinstall-readiness

permissions:
  contents: write

jobs:
  remediate-validate-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/genspark-preinstall-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply surgical compatibility patch
        run: node scripts/preinstall-finalize.mjs
      - name: Apply lint-safe transform patch
        run: node scripts/preinstall-lint-fix.mjs
      - name: Format repository changes
        run: npm run format
      - name: Regenerate Appwrite resources
        run: npm run appwrite:generate
      - name: Create clean validation commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(appwrite): complete presentation and runtime contracts"
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Runtime authority
        run: npm run launch:authority
      - name: Appwrite schema unit tests
        run: npx vitest run infrastructure/appwrite/tables/schema.test.mjs
      - name: PDF worker tests
        run: npm run test:run --workspace @pcr/pdf-worker
      - name: Notification worker tests
        run: npm run test:run --workspace @pcr/notification-worker
      - name: Dashboard worker tests
        run: npm run test:run --workspace @pcr/dashboard-worker
      - name: Document worker tests
        run: npm run test:run --workspace @pcr/document-worker
      - name: Integration worker tests
        run: npm run test:run --workspace @pcr/integration-worker
      - name: Web unit tests
        run: npx vitest run --config vitest.config.ts --project web
      - name: API unit tests
        run: npx vitest run apps/api/tests
      - name: Package unit tests
        run: npx vitest run packages/*/tests
      - name: Script unit tests
        run: npx vitest run scripts --passWithNoTests
      - name: Appwrite infrastructure unit tests
        run: npx vitest run infrastructure/appwrite --passWithNoTests
      - name: Rules tests
        run: npm run test:rules
      - name: Validate Appwrite resources
        run: npm run appwrite:validate
      - name: Security scan
        run: npm run security:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build applications
        run: npm run build
      - name: Verify built artifacts
        run: npm run verify:dist
      - name: Launch tests
        run: npm run launch:test
      - name: Launch package audit
        run: npm run launch:audit
      - name: Restore tracked TypeScript build caches
        run: |
          git restore \
            apps/ai-worker/tsconfig.tsbuildinfo \
            apps/api/tsconfig.tsbuildinfo \
            apps/pdf-worker/tsconfig.tsbuildinfo \
            packages/config/tsconfig.tsbuildinfo \
            packages/domain/tsconfig.tsbuildinfo \
            packages/templates/tsconfig.tsbuildinfo \
            packages/testing/tsconfig.tsbuildinfo \
            packages/ui/tsconfig.tsbuildinfo \
            packages/validation/tsconfig.tsbuildinfo
      - name: Require clean validated commit
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Push validated remediation
        run: git push origin HEAD:feat/genspark-preinstall-readiness
