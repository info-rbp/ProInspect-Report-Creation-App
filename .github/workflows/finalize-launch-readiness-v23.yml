name: Finalize launch readiness v2.3
on:
  push:
    branches:
      - feat/launch-readiness-installation-v2
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Regenerate documentation and integrity ledger
        run: node .github/finalize-launch-readiness-v23.mjs
      - name: Installer regression tests
        run: node --test infrastructure/upgrades/launch-readiness-v2/tests/installer.test.mjs
      - name: Package integrity audit
        run: node infrastructure/upgrades/launch-readiness-v2/cli.mjs audit
      - name: Clean checkout dry run
        run: node infrastructure/upgrades/launch-readiness-v2/cli.mjs plan
      - name: Commit verified package
        shell: bash
        run: |
          set -euo pipefail
          rm .github/finalize-launch-readiness-v23.mjs
          rm .github/workflows/finalize-launch-readiness-v23.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(launch): complete interrupted-deployment hardening v2.3'
          git push origin HEAD:feat/launch-readiness-installation-v2
