name: Materialize launch-readiness v2
on:
  push:
    branches: [feat/launch-readiness-installation-v2]
permissions:
  contents: write
concurrency:
  group: materialize-launch-readiness-v2
  cancel-in-progress: false
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require all archive parts
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          complete=true
          for part in .github/launchpkg.part00 .github/launchpkg.part01 .github/launchpkg.part02 .github/launchpkg.part03 .github/launchpkg.part04 .github/launchpkg.part05; do
            if [[ ! -f "$part" ]]; then complete=false; fi
          done
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - name: Materialize, verify and commit
        if: steps.parts.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/launchpkg.part0* | base64 --decode > "$RUNNER_TEMP/launchpkg.tgz"
          python - <<'PY'
          import pathlib, tarfile
          archive = pathlib.Path('${{ runner.temp }}/launchpkg.tgz')
          prefix = 'infrastructure/upgrades/launch-readiness-v2/'
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('Archive is empty')
              for member in members:
                  if not member.name.startswith(prefix) or '..' in pathlib.PurePosixPath(member.name).parts:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              target = pathlib.Path('.')
              tf.extractall(target, members=members, filter='data')
          PY
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          Object.assign(pkg.scripts, {
            'launch:init': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs init',
            'launch:audit': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs audit',
            'launch:local': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs local',
            'launch:plan': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs plan',
            'launch:doctor': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs doctor',
            'launch:complete': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs complete',
            'launch:install': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs install',
            'launch:verify': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs verify',
            'launch:deploy': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs deploy',
            'launch:status': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs status',
            'launch:gate': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs gate',
            'launch:unlock': 'node infrastructure/upgrades/launch-readiness-v2/cli.mjs unlock',
            'launch:test': 'node --test infrastructure/upgrades/launch-readiness-v2/tests/installer.test.mjs'
          });
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          node --test infrastructure/upgrades/launch-readiness-v2/tests/installer.test.mjs
          node infrastructure/upgrades/launch-readiness-v2/cli.mjs audit
          node infrastructure/upgrades/launch-readiness-v2/cli.mjs plan >/dev/null
          rm .github/launchpkg.part0*
          rm .github/workflows/materialize-launch-readiness-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(launch): complete launch-readiness installation package v2'
          git push origin HEAD:feat/launch-readiness-installation-v2
